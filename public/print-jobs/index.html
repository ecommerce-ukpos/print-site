<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Jobs — PrintSite</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    select, input, button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const SUPABASE_URL = "https://fqaxuhbcwoikeldnxuvv.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxYXh1aGJjd29pa2VsZG54dXZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDMwNzQyMTEsImV4cCI6MjA1ODY1MDIxMX0.q0RHsNYE7OxNfv2qvNWQJl2wkqWk0bL2l_KlsXirKzM";

    // ── Role simulation (replace with real auth later) ──────────────────────
    const ROLES = { steve: "steve", print: "print" };
    const ROLE_LABELS = { steve: "Steve (Artwork)", print: "Print Team" };

    // ── Status config ────────────────────────────────────────────────────────
    const STATUSES = {
      job_received:           { label: "Job Received",         colour: "#6366f1", bg: "#eef2ff" },
      awaiting_resubmission:  { label: "Awaiting Resubmission",colour: "#f59e0b", bg: "#fef3c7" },
      artwork_checked:        { label: "Artwork Checked",      colour: "#0ea5e9", bg: "#e0f2fe" },
      in_designer:            { label: "In Designer",          colour: "#8b5cf6", bg: "#f3e8ff" },
      sent_to_rip:            { label: "Sent to RIP",          colour: "#f97316", bg: "#fff7ed" },
      complete:               { label: "Complete",             colour: "#059669", bg: "#d1fae5" },
    };

    // Transitions each role is allowed to trigger
    const ALLOWED_TRANSITIONS = {
      steve: ["job_received","awaiting_resubmission","artwork_checked","in_designer","sent_to_rip","complete"],
      print: ["sent_to_rip","complete"],
    };

    const UPSCALE = {
      none:   { label: "Ready",      bg: "#d1fae5", text: "#065f46" },
      raster: { label: "Upscale",    bg: "#fef3c7", text: "#92400e" },
      vector: { label: "Vectorise",  bg: "#dbeafe", text: "#1e40af" },
      flag:   { label: "Flag",       bg: "#fee2e2", text: "#991b1b" },
    };

    const COLS = [
      { key: "sage_order",         label: "Sage Order",  w: 112 },
      { key: "magento_order",      label: "Magento",     w: 100 },
      { key: "company",            label: "Company",     w: 170 },
      { key: "customer_name",      label: "Customer",    w: 130 },
      { key: "sku",                label: "SKU",         w: 170 },
      { key: "asset_filename",     label: "File",        w: 200 },
      { key: "file_ext",           label: "Ext",         w: 48  },
      { key: "upscale_recommended",label: "Upscale",     w: 88  },
      { key: "status",             label: "Status",      w: 180 },
      { key: "updated_at",         label: "Updated",     w: 130 },
      { key: "status_note",        label: "Note",        w: 200 },
    ];

    async function supaFetch(path, opts = {}) {
      const res = await fetch(SUPABASE_URL + path, {
        ...opts,
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          Prefer: "return=representation",
          ...(opts.headers || {}),
        },
      });
      if (!res.ok) throw new Error(await res.text());
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    function fmtDate(d) {
      if (!d) return "—";
      const dt = new Date(d);
      return dt.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) + " " +
             dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    }

    function StatusBadge({ value }) {
      const s = STATUSES[value] || { label: value, colour: "#475569", bg: "#f1f5f9" };
      return (
        <span style={{ background: s.bg, color: s.colour, borderRadius: 4,
          padding: "3px 8px", fontSize: 11, fontWeight: 600, whiteSpace: "nowrap",
          border: `1px solid ${s.colour}22` }}>
          {s.label}
        </span>
      );
    }

    function UpscaleBadge({ value }) {
      if (!value) return <span style={{ color: "#9ca3af", fontSize: 11 }}>—</span>;
      const u = UPSCALE[value] || { label: value, bg: "#f3f4f6", text: "#374151" };
      return (
        <span style={{ background: u.bg, color: u.text, borderRadius: 4,
          padding: "2px 7px", fontSize: 11, fontWeight: 600, whiteSpace: "nowrap" }}>
          {u.label}
        </span>
      );
    }

    function SortTh({ col, sort, onSort, role }) {
      // Hide designer-facing cols from print role
      if (role === ROLES.print && ["upscale_recommended"].includes(col.key)) return null;
      const active = sort.key === col.key;
      return (
        <th onClick={() => onSort(col.key)} style={{
          padding: "10px 10px", textAlign: "left", whiteSpace: "nowrap",
          fontWeight: 600, fontSize: 11, color: active ? "#1e40af" : "#475569",
          letterSpacing: "0.05em", textTransform: "uppercase", cursor: "pointer",
          userSelect: "none", width: col.w, minWidth: col.w,
          background: active ? "#e8eef5" : "#f1f5f9",
          position: "sticky", top: 56, zIndex: 2,
          borderBottom: "2px solid #e2e8f0",
        }}>
          {col.label}&nbsp;
          <span style={{ opacity: active ? 1 : 0.3, fontSize: 10 }}>
            {active ? (sort.dir === "asc" ? "↑" : "↓") : "⇅"}
          </span>
        </th>
      );
    }

    // ── Status change modal ──────────────────────────────────────────────────
    function StatusModal({ job, role, onSave, onClose }) {
      const allowed = ALLOWED_TRANSITIONS[role];
      const [newStatus, setNewStatus] = useState(job.status);
      const [note, setNote] = useState("");
      const [saving, setSaving] = useState(false);

      async function save() {
        setSaving(true);
        try {
          await onSave(job.id, newStatus, note);
          onClose();
        } catch(e) {
          alert("Save failed: " + e.message);
        } finally {
          setSaving(false);
        }
      }

      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 100,
          display: "flex", alignItems: "center", justifyContent: "center" }}
          onClick={e => e.target === e.currentTarget && onClose()}>
          <div style={{ background: "#fff", borderRadius: 10, padding: 28, width: 420,
            boxShadow: "0 20px 60px rgba(0,0,0,0.2)" }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: "#0f172a", marginBottom: 4 }}>
              Update Job Status
            </div>
            <div style={{ fontSize: 12, color: "#64748b", marginBottom: 20 }}>
              {job.sage_order} · {job.magento_order || "Sage only"} · {job.company}
            </div>
            <div style={{ fontSize: 11, fontWeight: 600, color: "#475569", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>
              Current status
            </div>
            <div style={{ marginBottom: 16 }}><StatusBadge value={job.status} /></div>

            <div style={{ fontSize: 11, fontWeight: 600, color: "#475569", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>
              New status
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
              {Object.entries(STATUSES).map(([key, s]) => {
                const canSet = allowed.includes(key);
                const isSelected = newStatus === key;
                return (
                  <button key={key} onClick={() => canSet && setNewStatus(key)}
                    disabled={!canSet}
                    style={{
                      background: isSelected ? s.colour : s.bg,
                      color: isSelected ? "#fff" : s.colour,
                      border: `1.5px solid ${s.colour}`,
                      borderRadius: 5, padding: "5px 11px", fontSize: 11,
                      fontWeight: 600, cursor: canSet ? "pointer" : "not-allowed",
                      opacity: canSet ? 1 : 0.35, transition: "all 0.15s",
                    }}>
                    {s.label}
                  </button>
                );
              })}
            </div>

            <div style={{ fontSize: 11, fontWeight: 600, color: "#475569", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>
              Note (optional)
            </div>
            <textarea value={note} onChange={e => setNote(e.target.value)}
              placeholder="Add a note about this status change…"
              rows={3}
              style={{ width: "100%", border: "1px solid #e2e8f0", borderRadius: 6,
                padding: "8px 10px", fontSize: 12, resize: "vertical",
                outline: "none", color: "#374151" }} />

            <div style={{ display: "flex", gap: 8, marginTop: 18, justifyContent: "flex-end" }}>
              <button onClick={onClose}
                style={{ padding: "7px 16px", border: "1px solid #e2e8f0", borderRadius: 6,
                  background: "#fff", fontSize: 12, cursor: "pointer", color: "#475569" }}>
                Cancel
              </button>
              <button onClick={save} disabled={saving || newStatus === job.status}
                style={{ padding: "7px 16px", border: "none", borderRadius: 6,
                  background: newStatus === job.status ? "#e2e8f0" : "#0f172a",
                  color: newStatus === job.status ? "#9ca3af" : "#fff",
                  fontSize: 12, fontWeight: 600, cursor: newStatus === job.status ? "not-allowed" : "pointer" }}>
                {saving ? "Saving…" : "Save"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── Main component ───────────────────────────────────────────────────────
    export default function PrintJobs() {
      const [role, setRole]         = useState(ROLES.steve);
      const [rows, setRows]         = useState([]);
      const [loading, setLoading]   = useState(true);
      const [error, setError]       = useState(null);
      const [sort, setSort]         = useState({ key: "updated_at", dir: "desc" });
      const [search, setSearch]     = useState("");
      const [fStatus, setFStatus]   = useState("all");
      const [fSku, setFSku]         = useState("all");
      const [modal, setModal]       = useState(null); // job row

      async function loadJobs() {
        try {
          const [jobs, aa, om] = await Promise.all([
            supaFetch("/rest/v1/print_jobs?select=id,artwork_analysis_id,sage_order,magento_order,sku,status,status_note,updated_at,status_changed_at&order=updated_at.desc&limit=1000"),
            supaFetch("/rest/v1/artwork_analysis?select=id,asset_filename,file_ext,upscale_recommended,colour_mode,notes&limit=1000"),
            supaFetch("/rest/v1/order_manifest?select=sage_order,company,customer_name"),
          ]);

          const aaMap = {}, omMap = {};
          aa.forEach(a => { aaMap[a.id] = a; });
          om.forEach(o => { omMap[o.sage_order] = o; });

          const merged = jobs.map(j => {
            const a = aaMap[j.artwork_analysis_id] || {};
            const m = omMap[j.sage_order] || {};
            return {
              ...j,
              asset_filename:      a.asset_filename      || "—",
              file_ext:            a.file_ext            || "",
              upscale_recommended: a.upscale_recommended || null,
              colour_mode:         a.colour_mode         || null,
              company:             m.company             || "—",
              customer_name:       m.customer_name       || "—",
            };
          });
          setRows(merged);
          setError(null);
        } catch(e) {
          setError(e.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { loadJobs(); }, []);

      async function handleStatusSave(jobId, newStatus, note) {
        await supaFetch(`/rest/v1/print_jobs?id=eq.${jobId}`, {
          method: "PATCH",
          body: JSON.stringify({
            status: newStatus,
            status_note: note || null,
          }),
        });
        setRows(prev => prev.map(r => r.id === jobId
          ? { ...r, status: newStatus, status_note: note || null, updated_at: new Date().toISOString() }
          : r
        ));
      }

      const skuOptions = useMemo(() => {
        const s = new Set(rows.map(r => r.sku).filter(Boolean));
        return ["all", ...Array.from(s).sort()];
      }, [rows]);

      const sorted = useMemo(() => {
        let data = [...rows];
        if (search) {
          const q = search.toLowerCase();
          data = data.filter(r => Object.values(r).some(v => v && String(v).toLowerCase().includes(q)));
        }
        if (fStatus !== "all") data = data.filter(r => r.status === fStatus);
        if (fSku !== "all") data = data.filter(r => r.sku === fSku);
        data.sort((a, b) => {
          let av = a[sort.key] ?? "", bv = b[sort.key] ?? "";
          const cmp = String(av).localeCompare(String(bv), undefined, { numeric: true });
          return sort.dir === "asc" ? cmp : -cmp;
        });
        return data;
      }, [rows, sort, search, fStatus, fSku]);

      function toggleSort(key) {
        setSort(s => s.key === key ? { key, dir: s.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" });
      }

      const counts = useMemo(() => {
        const byStatus = {};
        Object.keys(STATUSES).forEach(k => { byStatus[k] = 0; });
        rows.forEach(r => { if (byStatus[r.status] !== undefined) byStatus[r.status]++; });
        return byStatus;
      }, [rows]);

      const sel = { padding: "7px 10px", border: "1px solid #e2e8f0", borderRadius: 6,
        fontSize: 12, background: "#fff", color: "#374151", cursor: "pointer" };

      if (loading) return (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center",
          height: "100vh", color: "#94a3b8", fontSize: 14 }}>
          Loading print jobs…
        </div>
      );
      if (error) return (
        <div style={{ padding: 32, color: "#dc2626", fontSize: 13 }}>Error: {error}</div>
      );

      return (
        <div style={{ minHeight: "100vh" }}>
          {modal && (
            <StatusModal
              job={modal}
              role={role}
              onSave={handleStatusSave}
              onClose={() => setModal(null)}
            />
          )}

          {/* Header */}
          <div style={{ background: "#fff", borderBottom: "1px solid #e2e8f0",
            padding: "12px 20px", position: "sticky", top: 0, zIndex: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>

              <div style={{ marginRight: 8 }}>
                <div style={{ fontSize: 16, fontWeight: 700, color: "#0f172a", letterSpacing: "-0.02em" }}>
                  Print Jobs
                </div>
                <div style={{ fontSize: 11, color: "#64748b", marginTop: 1, display: "flex", gap: 10 }}>
                  {Object.entries(STATUSES).map(([k, s]) => (
                    <span key={k} style={{ color: s.colour }}>
                      {s.label}: <strong>{counts[k]}</strong>
                    </span>
                  ))}
                </div>
              </div>

              <input value={search} onChange={e => setSearch(e.target.value)}
                placeholder="Search…"
                style={{ ...sel, width: 180, padding: "7px 12px" }} />

              <select value={fStatus} onChange={e => setFStatus(e.target.value)} style={sel}>
                <option value="all">All statuses</option>
                {Object.entries(STATUSES).map(([k, s]) =>
                  <option key={k} value={k}>{s.label}</option>
                )}
              </select>

              <select value={fSku} onChange={e => setFSku(e.target.value)} style={{ ...sel, maxWidth: 190 }}>
                {skuOptions.map(s => <option key={s} value={s}>{s === "all" ? "All SKUs" : s}</option>)}
              </select>

              {/* Role switcher — placeholder until real auth */}
              <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 11, color: "#94a3b8" }}>Viewing as:</span>
                <select value={role} onChange={e => setRole(e.target.value)}
                  style={{ ...sel, fontSize: 11, fontWeight: 600,
                    color: role === ROLES.steve ? "#1e40af" : "#059669",
                    background: role === ROLES.steve ? "#eff6ff" : "#f0fdf4" }}>
                  {Object.entries(ROLE_LABELS).map(([k, v]) =>
                    <option key={k} value={k}>{v}</option>
                  )}
                </select>
                <span style={{ fontSize: 11, color: "#94a3b8" }}>{sorted.length} shown</span>
              </div>
            </div>
          </div>

          {/* Table */}
          <div style={{ overflowX: "auto" }}>
            <table style={{ borderCollapse: "collapse", width: "max-content", minWidth: "100%", fontSize: 12 }}>
              <thead>
                <tr>
                  {COLS.map(col => {
                    if (role === ROLES.print && col.key === "upscale_recommended") return null;
                    return <SortTh key={col.key} col={col} sort={sort} onSort={toggleSort} role={role} />;
                  })}
                  <th style={{ padding: "10px 10px", textAlign: "left", fontWeight: 600,
                    fontSize: 11, color: "#475569", letterSpacing: "0.05em", textTransform: "uppercase",
                    background: "#f1f5f9", position: "sticky", top: 56, zIndex: 2,
                    borderBottom: "2px solid #e2e8f0", whiteSpace: "nowrap", width: 160, minWidth: 160 }}>
                    Actions
                  </th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((row, i) => {
                  const bg = i % 2 === 0 ? "#fff" : "#f8fafc";
                  const isComplete = row.status === "complete";
                  const td = (content, extra = {}) => (
                    <td style={{ padding: "7px 10px", borderBottom: "1px solid #f1f5f9",
                      whiteSpace: "nowrap", background: bg,
                      opacity: isComplete ? 0.6 : 1, ...extra }}>
                      {content}
                    </td>
                  );
                  return (
                    <tr key={row.id}
                      onMouseEnter={e => Array.from(e.currentTarget.cells).forEach(c => c.style.background = "#eff6ff")}
                      onMouseLeave={e => Array.from(e.currentTarget.cells).forEach(c => c.style.background = bg)}>

                      {/* Sage */}
                      {td(<span style={{ fontFamily: "monospace", fontSize: 11, color: "#475569" }}>{row.sage_order}</span>)}
                      {/* Magento */}
                      {td(<span style={{ fontFamily: "monospace", fontSize: 11, color: "#94a3b8" }}>{row.magento_order || "—"}</span>)}
                      {/* Company */}
                      {td(<span title={row.company} style={{ fontWeight: 600, color: "#0f172a",
                        display: "block", overflow: "hidden", textOverflow: "ellipsis", maxWidth: 160 }}>
                        {row.company}
                      </span>)}
                      {/* Customer */}
                      {td(<span title={row.customer_name} style={{ color: "#475569",
                        display: "block", overflow: "hidden", textOverflow: "ellipsis", maxWidth: 120 }}>
                        {row.customer_name}
                      </span>)}
                      {/* SKU */}
                      {td(row.sku
                        ? <span style={{ fontFamily: "monospace", fontSize: 11, fontWeight: 600,
                            color: "#1e40af", background: "#eff6ff", padding: "2px 6px", borderRadius: 4 }}>
                            {row.sku}
                          </span>
                        : <span style={{ color: "#9ca3af", fontSize: 11 }}>No SKU</span>
                      )}
                      {/* File */}
                      {td(<span title={row.asset_filename} style={{ fontFamily: "monospace", fontSize: 11,
                        color: "#374151", display: "block", overflow: "hidden", textOverflow: "ellipsis", maxWidth: 190 }}>
                        {row.asset_filename}
                      </span>)}
                      {/* Ext */}
                      {td(<span style={{ background: "#f1f5f9", color: "#475569", borderRadius: 3,
                        padding: "1px 5px", fontSize: 10, fontFamily: "monospace", fontWeight: 600 }}>
                        {(row.file_ext || "").replace(".", "").toUpperCase()}
                      </span>, { textAlign: "center" })}
                      {/* Upscale (steve only) */}
                      {role === ROLES.steve && td(<UpscaleBadge value={row.upscale_recommended} />)}
                      {/* Status */}
                      {td(<StatusBadge value={row.status} />)}
                      {/* Updated */}
                      {td(<span style={{ color: "#94a3b8", fontSize: 11 }}>{fmtDate(row.updated_at)}</span>)}
                      {/* Note */}
                      {td(<span title={row.status_note || ""} style={{ color: "#64748b", fontSize: 11,
                        display: "block", overflow: "hidden", textOverflow: "ellipsis", maxWidth: 190 }}>
                        {row.status_note || "—"}
                      </span>)}
                      {/* Actions */}
                      <td style={{ padding: "7px 10px", borderBottom: "1px solid #f1f5f9",
                        background: bg, whiteSpace: "nowrap" }}>
                        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                          <button onClick={() => setModal(row)}
                            style={{ background: "#f1f5f9", color: "#374151", border: "1px solid #e2e8f0",
                              borderRadius: 5, padding: "4px 10px", fontSize: 11,
                              fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>
                            Update Status
                          </button>
                          {role === ROLES.steve && (
                            <button onClick={() => {
                              const p = new URLSearchParams({ sku: row.sku || "", asset: row.asset_filename, order: row.sage_order });
                              window.open("/designer/?" + p.toString(), "_blank");
                            }}
                              style={{ background: "#0f172a", color: "#fff", border: "none",
                                borderRadius: 5, padding: "4px 10px", fontSize: 11,
                                fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>
                              Designer →
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {sorted.length === 0 && (
              <div style={{ textAlign: "center", padding: "64px 24px", color: "#94a3b8", fontSize: 13 }}>
                No jobs match the current filters.
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PrintJobs />);
  </script>
</body>
</html>
