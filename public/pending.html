<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awaiting Approval — Print Site</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#FAFAF8;color:#2C2C2A;min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:400px;padding:0 24px;text-align:center}
.logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px}
.wordmark{font-size:16px;font-weight:700;color:#2C2C2A;letter-spacing:-.02em}
.divider{color:#D3D1C7;font-size:16px}
.subtitle{font-size:15px;color:#888780}
.card{background:#fff;border:1px solid #E8E6DE;border-radius:14px;padding:36px 28px}
.pending-icon{width:60px;height:60px;border-radius:50%;background:#FFFBEB;border:1px solid #FDE68A;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 20px}
.card-title{font-size:19px;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}
.card-sub{font-size:13.5px;color:#5F5E5A;line-height:1.6;margin-bottom:24px}
.info-box{background:#FAFAF8;border:1px solid #E8E6DE;border-radius:10px;padding:16px;margin-bottom:22px;text-align:left}
.info-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:13px}
.info-row:last-child{margin-bottom:0}
.info-dot{width:6px;height:6px;border-radius:50%;background:#F59E0B;margin-top:5px;flex-shrink:0}
.info-text{color:#5F5E5A;line-height:1.5}
.btn{width:100%;padding:9px;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid #E8E6DE;background:#fff;color:#5F5E5A;font-family:inherit;margin-top:8px}
.btn:first-of-type{margin-top:0}
.btn:hover{background:#FAFAF8;border-color:#D3D1C7;color:#2C2C2A}
.user-email{font-size:12px;color:#888780;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <div class="wordmark">UKPOS</div>
    <div class="divider">/</div>
    <div class="subtitle">Print Site</div>
  </div>
  <div class="card">
    <div class="pending-icon">⏳</div>
    <div class="card-title">Awaiting Approval</div>
    <div class="card-sub">Your account has been created and is pending review by an administrator.</div>
    <div class="info-box">
      <div class="info-row"><div class="info-dot"></div><div class="info-text">Your request has been logged and a super admin will review it shortly</div></div>
      <div class="info-row"><div class="info-dot"></div><div class="info-text">You'll receive an email once your access is approved</div></div>
      <div class="info-row"><div class="info-dot"></div><div class="info-text">If you believe this is an error, contact your team administrator</div></div>
    </div>
    <button class="btn" onclick="checkStatus()">Check Status &amp; Refresh</button>
    <button class="btn" style="margin-top:8px" onclick="doSignOut()">Sign Out</button>
    <div class="user-email" id="user-email"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL = 'https://fqaxuhbcwoikeldnxuvv.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxYXh1aGJjd29pa2VsZG54dXZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNjk2NTQsImV4cCI6MjA5Njc0NTY1NH0.0XtMq5p6L9pnRilG5GUI5j72zPNuhl4PnD9ihDxeT1c';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  document.getElementById('user-email').textContent = session.user.email;
  // If already approved (e.g. page was refreshed after admin approved), send them in
  const { data: profile } = await sb.from('profiles').select('status').eq('id', session.user.id).single();
  if (profile?.status === 'approved') { window.location.href = '/'; }
})();

async function checkStatus() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  const { data: profile } = await sb.from('profiles').select('status').eq('id', session.user.id).single();
  if (profile?.status === 'approved') {
    window.location.href = '/';
  } else {
    const icon = document.querySelector('.pending-icon');
    icon.textContent = '✓';
    setTimeout(() => { icon.textContent = '⏳'; }, 1000);
    alert('Still awaiting approval. Check back later.');
  }
}

async function doSignOut() {
  await sb.auth.signOut();
  window.location.href = '/login.html';
}
</script>
</body>
</html>
